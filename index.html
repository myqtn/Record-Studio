<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio – Part 21</title>
<style>
:root{--bg:#16181c;--pn:#1f2328;--ln:#323840;--tx:#e8e6e1;--dm:#8b929b;--ac:#f2b441;--rd:#ff4d5e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{background:#2b3139;border:1px solid var(--ln);border-radius:8px;min-width:40px;height:40px;padding:0 10px;cursor:pointer}
button:active{background:#3a424c}
input[type=text],input[type=number],select{background:#101215;border:1px solid var(--ln);border-radius:8px;height:36px;padding:0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--pn);border-bottom:1px solid var(--ln)}
.bar label{display:flex;align-items:center;gap:4px;color:var(--dm);white-space:nowrap}
#time{font:600 17px ui-monospace,monospace;min-width:92px;color:var(--ac)}
#rec.on{background:var(--rd);border-color:var(--rd)}
#play.on{background:var(--ac);color:#111}
.meter{width:70px;height:10px;background:#101215;border:1px solid var(--ln);border-radius:5px;overflow:hidden}
#mt{height:100%;width:0;background:linear-gradient(90deg,#4cd08a 70%,var(--ac) 85%,var(--rd))}
#sc{flex:1;min-height:0;overscroll-behavior:contain;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#in{position:relative;min-height:100%}
.row{display:flex;height:112px;border-bottom:1px solid var(--ln)}
.rul{height:28px;cursor:pointer;position:sticky;top:0;z-index:7;background:var(--bg)}
.hd{position:sticky;left:0;z-index:5;width:150px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:6px;display:flex;flex-direction:column;gap:5px}
.hd .nm{width:100%;height:28px;border-left:5px solid var(--c)}
.hd .bt{display:flex;gap:4px}.hd .bt button{height:28px;min-width:0;flex:1;padding:0}
.hd input[type=range]{width:100%;margin:0;height:16px}
.hd .on-r{background:var(--rd)}.hd .on-m{background:#5a6572}.hd .on-s{background:var(--ac);color:#111}
.lane{width:var(--w);position:relative;flex:none;background:repeating-linear-gradient(90deg,transparent 0 79px,#ffffff08 79px 80px)}
.clip{position:absolute;top:6px;bottom:6px;border-radius:6px;overflow:hidden;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#101215)}
.clip.sel{outline:2px solid #fff}
.clip canvas{height:100%;display:block}
.clip{touch-action:pan-x pan-y;cursor:grab}.clip.sel{touch-action:none}
.clip.sel::before,.clip.sel::after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#fffa;z-index:2}
.clip.sel::after{right:0}
.reg{position:absolute;top:0;bottom:0;background:#f2b44140;border-left:2px solid var(--ac);border-right:2px solid var(--ac);pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--rd);z-index:6;pointer-events:none}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--ln);padding-left:3px;color:var(--dm);font-size:11px;line-height:28px}
#fxp{position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;background:var(--pn);border-top:2px solid var(--ac);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:50;display:none}
#fxp .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#fxp .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
#fxp label{display:flex;flex-direction:column;gap:2px;color:var(--dm)}#fxp input{width:100%;margin:0;height:28px}
#fxp .note{grid-column:1/-1;color:var(--dm)}
#fxp select,#fxp input[type=number]{width:100%}
#fxp .chk{flex-direction:row;align-items:center;gap:8px;color:var(--tx)}#fxp .chk input{width:auto;height:auto}
#fxp .go{background:var(--ac);color:#111;grid-column:1/-1;height:46px;font-weight:600}
#fxp a.sv{display:block;padding:12px;border:1px solid var(--ac);border-radius:8px;color:var(--ac);margin-top:6px;word-break:break-all}
body{height:100dvh}
#top{flex:none;z-index:30}
#tabs{padding:6px 8px}#tabs .tab{flex:1;min-width:0;padding:0 4px}
.tab.on{background:var(--ac);color:#111;border-color:var(--ac)}
.bar.menu{display:none;max-height:42vh;overflow:auto;background:#252a31;border-bottom:2px solid var(--ac);-webkit-overflow-scrolling:touch}
.bar.menu.open{display:flex}
.menu .br{flex-basis:100%;height:0}
.addt{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700;margin:0 4px}
.hd .addt{height:26px;min-width:0;padding:0}.hd .addb{height:46px;font-size:15px}
.clip.live{pointer-events:none;border-style:dashed}
.clip.live canvas{position:absolute;top:0;height:100%}
.clip.live::before{content:"● REC";position:absolute;right:6px;top:2px;color:var(--rd);font-size:11px;z-index:3}
#mbtn.on,#snbtn.on,#msel.on{background:var(--ac);color:#111;border-color:var(--ac)}
.clip.grp{box-shadow:0 0 0 2px #ffffffaa,inset 0 -5px 0 #ffffff66}
#tabs .gear{flex:none;width:44px}
#cover{position:fixed;inset:0;z-index:300;background:#030912;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 12px calc(18px + env(safe-area-inset-bottom));transition:opacity .45s}
#cover.out{opacity:0;pointer-events:none}
#cover img{flex:1;min-height:0;width:100%;object-fit:contain}
#cover .cb{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
#cover .go2{height:54px;font-size:17px;font-weight:700;background:var(--ac);color:#111;border-color:var(--ac);border-radius:12px}
#cover .sk{background:none;border:0;color:var(--dm);height:32px}
#cover #cmsg{color:var(--dm);min-height:36px;font-size:13px;max-height:30vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;display:none;z-index:99}

.bar.menu.sized{height:var(--mh);max-height:none;align-content:flex-start}
#rsz,#fxg{display:none;flex:none;height:22px;background:#252a31;border-bottom:2px solid var(--ac);cursor:ns-resize;touch-action:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#rsz::after,#fxg::after{content:"";width:56px;height:5px;border-radius:3px;background:var(--dm)}
#rsz.show,#fxg.show{display:flex}
#fxg{position:fixed;left:0;right:0;z-index:51;border-bottom:0;border-top:2px solid var(--ac);border-radius:10px 10px 0 0}
#sc{touch-action:pan-x pan-y}
#fxp{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:38px}
#fxp input[type=range]{touch-action:pan-y;height:34px}
#fxp label{padding:4px 0}
#fxp .fg{gap:16px 18px}
</style></head><body>
<div class="bar">
  <button id="rw" title="Back to start">⏮</button>
  <button id="play" title="Play / pause">▶</button>
  <button id="stop" title="Stop and return to start">⏹</button>
  <button id="rec" title="Record onto the armed track">⏺</button>
  <span id="time">0:00.000</span>
  <button id="mbtn" title="Metronome click on/off">♪</button><button id="snbtn" title="Snap clips to the beat on/off">🧲 Snap</button><button id="msel" title="Multi-select: tap clips to add or remove them from the selection">☑ Multi</button>
  <div class="meter" title="Input level"><div id="mt"></div></div>
</div>
<div class="bar">
  <label>BPM <input id="bpm" type="number" min="40" max="240" value="100" style="width:64px"></label>
  <label><input id="metro" type="checkbox" checked>Click</label>
  <label><input id="count" type="checkbox" checked>Count-in</label>
  <label title="Hear your voice in your earphones while singing. Use earphones to avoid feedback.">
    <input id="mon" type="checkbox" checked>Monitor</label>
  <label title="Nudge recordings earlier (+) or later (−) if they feel off">Sync ms
    <input id="lat" type="number" value="0" step="5" style="width:64px"></label>
  <button id="zout" title="Zoom out">−</button><label>Zoom <input id="zoom" type="range" min="10" max="600" value="80" style="width:90px"></label><button id="zin" title="Zoom in">+</button><button id="zfit" title="Fit whole song on screen">Fit</button><label title="Timeline follows the playhead while playing. Scroll yourself to look around; tick again to re-follow."><input id="follow" type="checkbox" checked>Follow</label>
  <label>Master <input id="mv" type="range" min="0" max="1.2" step="0.01" value="0.9" style="width:90px"></label>
  <button id="add">+ Track</button>
  <button id="del" title="Delete selected clip">Delete clip</button>
</div>
<div class="bar">
  <input id="nm" type="text" value="My Song" style="width:130px">
  <button id="save">Save</button>
  <select id="list" style="max-width:130px"></select>
  <button id="load">Load</button>
  <button id="new">New</button>
  <button id="imp" title="Add an audio file (backing track, beat, guitar) at the playhead">Import audio</button><input id="file" type="file" multiple accept="audio/*,.zip,application/zip,application/x-zip-compressed" hidden><button id="aud" title="Choose microphone and headphones, Bluetooth setup">Audio in/out</button><button id="mst" title="Mastering chain: EQ, saturation, stereo width, glue compression">Master</button><button id="exp" title="Export final mix or stems">Export…</button>
</div>
<div class="bar">
  <button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button>
  <button id="split" title="Split at playhead (S). Splits the selected clip, or every clip under the playhead">Split</button>
  <button id="copy">Copy</button><button id="paste" title="Paste at playhead on the armed track (or the copied clip's track)">Paste</button>
  <button id="dup" title="Duplicate selected clips right after themselves">Duplicate</button><button id="sall" title="Select every clip">Select all</button><button id="snone" title="Clear selection">Deselect</button><button id="grp" title="Group selected clips so they move together">Group</button><button id="ugr" title="Ungroup selected clips">Ungroup</button><button id="rep" title="Repeat selected clip back-to-back">Repeat…</button>
  <button id="rip" title="Delete selected clip and close the gap">Ripple cut</button>
  <label><input id="snap" type="checkbox" checked>Snap</label>
  <button id="sa" title="Set loop/cut start at playhead">A</button><button id="sb" title="Set loop/cut end at playhead">B</button><button id="sx" title="Clear A–B">✕</button>
  <label><input id="loop" type="checkbox">Loop A–B</label>
  <button id="cut" title="Remove A–B from every track and close the gap">Remove A–B</button>
</div>
<div id="sc"><div id="in"></div></div>
<div id="fxp"></div><div id="toast"></div>

function analyzeTaps(ch,sr,start,spb,N){
  const t0=ch[0].t;let n=0;ch.forEach(c=>n+=c.d.length);
  const env=new Float32Array(n);let o=0;ch.forEach(c=>{for(let i=0;i<c.d.length;i++)env[o++]=Math.abs(c.d[i])});
  const w=Math.max(1,Math.round(sr*.003)),sm=new Float32Array(n);let s=0;
  for(let i=0;i<n;i++){s+=env[i];if(i>=w)s-=env[i-w];sm[i]=s/w}
  const floor=Float32Array.from(sm).sort()[Math.floor(n*.5)],thr=Math.max(.02,floor*8),ds=[];
  for(let i=2;i<N;i++){
    const te=start+i*spb,a=Math.max(0,Math.round((te-.15-t0)*sr)),b=Math.min(n,Math.round((te+.6-t0)*sr));
    let pk=0,pi=-1;for(let j=a;j<b;j++)if(sm[j]>pk){pk=sm[j];pi=j}
    if(pi>=0&&pk>thr)ds.push(t0+pi/sr-te);
  }
  return ds;
}

    const multi=aud.length>1;hist();
    for(let i=0;i<aud.length;i++){
      const f=aud[i];
      if(multi&&S.tracks.length>=16){skipped++;continue}
      toast('Decoding '+(i+1)+'/'+aud.length+': '+f.name+'…');
      let buf=null;
      try{buf=await ctx.decodeAudioData(await f.arrayBuffer())}catch(err){fail.push(f.name);continue}
      if(memUsed()+bufBytes(buf)>memCap()){buf=null;memStop=true;skipped+=aud.length-i;break}
      let t;
      if(multi){newTrack(f.name.replace(/\.[^.]+$/,'').slice(0,24));t=S.tracks[S.tracks.length-1];applyMix()}
      else t=S.tracks.find(x=>x.arm)||(selClip()||{}).t||S.tracks[0];
      if(!t){buf=null;continue}
      const c={id:uid++,buf,start:snap(pos()),off:0,dur:buf.duration,fi:0,fo:0,gn:1};
      t.clips.push(c);S.sel={t:t.id,c:c.id};ok++;buf=null;
      await new Promise(r=>setTimeout(r,30));
    }
    if(!ok)undo.pop();
    render();
  }
  for(const z of zips)await importZip(z);
  if(aud.length){
    let m='Imported '+ok+' file'+(ok===1?'':'s');
    if(skipped)m+=' ('+skipped+' skipped'+(memStop?' – memory limit reached, '+mb(memUsed())+' in use':' – 16 track max')+')';
    if(fail.length)m+=' ('+fail.length+' unreadable)';
    toast(m);
  }
}
function buildRuler(rn,W){
  const step=S.pps>=100?1:S.pps>=50?2:5,fr=document.createDocumentFragment();
  for(let s=0;s*S.pps<W;s+=step){const t=document.createElement('div');t.className='tick';t.style.left=s*S.pps+'px';t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');fr.appendChild(t)}
  if(S.A!=null){const g=document.createElement('div');g.className='reg';g.style.left=S.A*S.pps+'px';g.style.width=((S.B!=null?S.B:S.A)-S.A)*S.pps+'px';fr.appendChild(g)}
  rn.appendChild(fr);
}
function ensureDrawn(){
  if(performance.now()-(S.zt||0)<140)return schedDraw();
  const sc=$('#sc'),L=sc.scrollLeft-HW-400,R=sc.scrollLeft+sc.clientWidth-HW+400;
  document.querySelectorAll('.clip[data-cid]').forEach(d=>{
    const x0=parseFloat(d.style.left)||0,x1=x0+(parseFloat(d.style.width)||0);if(x1<L||x0>R)return;
    const o=S.cm.get(+d.dataset.cid);if(!o)return;
    const c=o.c,cv=d.querySelector('canvas'),k=S.pps+'|'+c.off+'|'+c.dur+'|'+o.t.color;
    if(!cv||cv.dataset.k===k)return;cv.dataset.k=k;draw(cv,c,o.t.color);
    d.querySelectorAll('.fd').forEach(f=>f.style.width=c[f.dataset.k]*S.pps+'px');
  });
}
function schedDraw(){clearTimeout(schedDraw.h);schedDraw.h=setTimeout(ensureDrawn,160)}
function relayout(){
  const inn=$('#in'),pp=S.pps,W=Math.max(30,end()+20,P?pos()+20:0)*pp;
  inn.style.setProperty('--w',W+'px');inn.style.width=(HW+W)+'px';
  document.querySelectorAll('.clip[data-cid]').forEach(d=>{
    const o=S.cm.get(+d.dataset.cid);if(!o)return;const c=o.c;
    d.style.left=c.start*pp+'px';d.style.width=c.dur*pp+'px';
    const cv=d.querySelector('canvas');if(cv)cv.style.width=c.dur*pp+'px';
    d.querySelectorAll('.fd').forEach(f=>f.style.width=c[f.dataset.k]*pp+'px');
  });
  const rn=document.querySelector('.rul .lane');if(rn){rn.innerHTML='';buildRuler(rn,W)}
  const ph=$('#ph');if(ph)ph.style.left=HW+pos()*pp+'px';
}
let zq=null;
function zoomTo(np,ax){
  if(zq){zq.np=np;if(ax!=null)zq.ax=ax;return}
  zq={np,ax};
  requestAnimationFrame(()=>{const q=zq;zq=null;zoomNow(q.np,q.ax)});
}
(function(){
  const sc=$('#sc');let r=0;
  sc.addEventListener('scroll',()=>{if(r)return;r=requestAnimationFrame(()=>{r=0;ensureDrawn()})},{passive:true});
  /* FX / settings panel: a vertical swipe on a slider scrolls the panel instead of moving the slider */
  const fx=$('#fxp');let g=null;
  const undoMove=()=>{if(g&&!g.dead){g.dead=true;if(g.i.value!==g.v){g.i.value=g.v;g.i.dispatchEvent(new Event('input'))}}};
  fx.addEventListener('pointerdown',e=>{const i=e.target;g=i&&i.type==='range'?{i,x:e.clientX,y:e.clientY,v:i.value,dead:false,id:e.pointerId}:null},true);
  fx.addEventListener('pointermove',e=>{
    if(!g||g.dead||e.pointerId!==g.id||e.pointerType==='mouse')return;
    const dx=Math.abs(e.clientX-g.x),dy=Math.abs(e.clientY-g.y);
    if(dy>10&&dy>dx*1.2)undoMove();
  },true);
  fx.addEventListener('pointercancel',()=>{undoMove();g=null},true);
  fx.addEventListener('pointerup',()=>{g=null},true);
})();
render();refreshList();ui();
</script></body></html>
